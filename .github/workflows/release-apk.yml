name: Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install SDK components
        run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager 'platforms;android-36' 'build-tools;35.0.0'

      - name: Build Debug APK
        working-directory: apps/android
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Create Release and Upload APK
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Aquí está la variable que querías poner:
          ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"
        with:
          # Cambiado a 'v-latest' porque GitHub Releases requiere obligatoriamente un formato de tag válido si corres en workflow_dispatch
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v-latest' }}
          files: apps/android/app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true
